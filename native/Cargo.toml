[package]
name = "photocraft-depth-studio-native"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Private local depth inference and depth-guided blur worker for PhotoCraft"

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "depth-studio-worker"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

