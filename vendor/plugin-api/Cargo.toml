[package]
name = "photocraft-plugin-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Standalone versioned data contracts for PhotoCraft plugins"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = { version = "1.2", optional = true }

[features]
default = []
schema = ["dep:schemars"]

[[example]]
name = "export_schemas"
required-features = ["schema"]

[lints.rust]
unsafe_code = "forbid"